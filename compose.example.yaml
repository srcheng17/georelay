# 仅供开发/后续审查的 sidecar 示例；不是生产 stack 的替换文件。
services:
  amap-adapter:
    build:
      context: ./adapter
    environment:
      GEOCODER_PROVIDER: "${GEOCODER_PROVIDER:-auto}"
      MAINLAND_PROVIDER: "${MAINLAND_PROVIDER:-amap}"
      BAIDU_AK: "${BAIDU_AK:-}"
      BAIDU_SK: "${BAIDU_SK:-}"
      AMAP_API_REGION: "${AMAP_API_REGION:-mainland}"
      AMAP_KEY: "${AMAP_KEY:-}"
      NOMINATIM_USER_AGENT: "${NOMINATIM_USER_AGENT:-}"
      ADAPTER_DB: /data/adapter.sqlite3
      CACHE_TTL_SECONDS: "86400"
      UPSTREAM_TIMEOUT_SECONDS: "8"
      LOOKUP_TIMEOUT_SECONDS: "20"
    volumes:
      - amap-data:/data
    networks:
      - geocoding
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # 不映射 host ports；补丁版 TeslaMate 需接入此网络并设置：
    # NOMINATIM_BASE_URL=http://amap-adapter:8080

volumes:
  amap-data:
networks:
  # 普通私有 bridge 保留访问地址服务的出口；internal:true 会阻断出口。
  geocoding:
