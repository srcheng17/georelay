name: Validate and build
run-name: images/${{ github.event_name }}/${{ github.event.pull_request.number || inputs.source_pr || '0' }}/${{ github.event.pull_request.head.sha || github.sha }}/${{ (inputs.publish || github.event_name == 'pull_request' || github.event_name == 'push') && 'publish' || 'check' }}/${{ inputs.expected_main_sha || '-' }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish checked images (main stable/latest, same-repository branch beta)
        type: boolean
        default: false
      expected_main_sha:
        description: Expected merge commit for an automated main publication
        type: string
        default: ''
      source_pr:
        description: Associated PR number for a beta candidate or merged main publication
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_required: ${{ steps.changes.outputs.image_required }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      channel: ${{ steps.source.outputs.channel }}
      version: ${{ steps.source.outputs.version }}
      pr_number: ${{ steps.source.outputs.pr_number }}
      publish_required: ${{ steps.source.outputs.publish_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind tested source and publication channel
        id: source
        run: python3 scripts/image_context.py
      - name: Decide whether images are required
        id: changes
        env:
          TESTED_SHA: ${{ steps.source.outputs.source_sha }}
        run: python3 scripts/ci_changes.py
      - name: Whitespace checks
        run: git diff --check
      - name: Python checks for metadata-only changes
        if: always() && steps.changes.outputs.image_required == 'false'
        run: python3 -m unittest discover -s tests -v

  build:
    name: build-${{ matrix.architecture }}
    needs: checks
    if: needs.checks.outputs.image_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            runner: ubuntu-latest
          - architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Python checks
        run: python3 -m unittest discover -s tests -v
      - name: Check fixed upstream and apply every patch
        run: python3 scripts/prepare_upstream.py "$RUNNER_TEMP/teslamate-upstream"
      - name: Upstream contract tests in isolated containers
        run: bash scripts/test_upstream.sh "$RUNNER_TEMP/teslamate-upstream"
      - name: Build adapter and patched TeslaMate
        env:
          IMAGE_VERSION: ${{ needs.checks.outputs.version }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          labels=(--label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.version=$IMAGE_VERSION")
          docker build --platform "linux/$IMAGE_ARCHITECTURE" "${labels[@]}" --label 'org.opencontainers.image.title=GeoRelay address adapter' -t georelay-adapter:checked adapter
          docker build --platform "linux/$IMAGE_ARCHITECTURE" "${labels[@]}" --label 'org.opencontainers.image.title=GeoRelay' -t georelay:checked "$RUNNER_TEMP/teslamate-upstream"
          for image in georelay-adapter georelay; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image:checked")" = "linux/$IMAGE_ARCHITECTURE"
            uid=$(docker run --rm --entrypoint id "$image:checked" -u)
            [[ $uid =~ ^[1-9][0-9]*$ ]] || exit 1
          done
          docker run --rm --entrypoint /bin/sh georelay-adapter:checked -c 'test -r /usr/share/doc/georelay-adapter/LICENSE && test -s /usr/share/doc/georelay-adapter/MODIFICATIONS.md'
      - name: Adapter packaged-code test suite without external network
        timeout-minutes: 5
        run: |
          exec docker run --rm --network none --name "georelay-adapter-suite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/tests,readonly" --entrypoint python georelay-adapter:checked -c 'import sys, unittest; from adapter import server; assert server.__file__ == "/app/adapter/server.py"; result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("/tests", pattern="test_adapter.py")); sys.exit(not result.wasSuccessful())'
      - name: Adapter container health without a key or host port
        run: |
          container="amap-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${container}-data"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume"
          docker run -d --name "$container" --network none --mount "type=volume,source=$volume,target=/data" georelay-adapter:checked
          healthy=false
          for attempt in $(seq 1 20); do
            if docker exec "$container" python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)) == {"status": "ok", "protocol": 1, "storage": "disposable-cache"}' >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
      - name: Main application startup, migrations and address runtime contract
        timeout-minutes: 5
        run: exec bash scripts/test_main_image.sh georelay:checked georelay-adapter:checked
      - name: Legacy identity import in compiled release
        timeout-minutes: 5
        env:
          MAIN_IMAGE_IDENTITY_SCENARIO: legacy
        run: exec bash scripts/test_main_image.sh georelay:checked georelay-adapter:checked
      - name: Preserve checked images for publication
        if: needs.checks.outputs.publish_required == 'true'
        env:
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: docker save -o "$RUNNER_TEMP/checked-images-$IMAGE_ARCHITECTURE.tar" georelay-adapter:checked georelay:checked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.checks.outputs.publish_required == 'true'
        with:
          name: checked-images-${{ matrix.architecture }}
          path: ${{ runner.temp }}/checked-images-${{ matrix.architecture }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Keep the single required check name for main's branch protection.
  verify:
    needs: [checks, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks and the selected image validation
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          IMAGE_REQUIRED: ${{ needs.checks.outputs.image_required }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          case "$CHECKS_RESULT:$IMAGE_REQUIRED:$BUILD_RESULT" in
            success:true:success|success:false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  publish:
    needs: [checks, build, verify]
    if: needs.checks.outputs.image_required == 'true' && needs.build.result == 'success' && needs.verify.result == 'success' && needs.checks.outputs.publish_required == 'true'
    concurrency:
      group: ghcr-publication-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: checked-images-*
          merge-multiple: true
          path: ${{ runner.temp }}/checked-images
      - name: Publish only the checked multi-architecture version
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/publication-receipt.json
        run: bash scripts/publish_images.sh "$RUNNER_TEMP/checked-images"
      - name: Preserve publication receipt even when alias promotion fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.checks.outputs.source_sha }}-${{ needs.checks.outputs.version }}
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 90

  # Fresh runner; candidate files/artifacts are only bounded API text/data.
  release-record:
    needs: [checks, build, verify, publish]
    if: always() && needs.checks.outputs.image_required == 'true' && needs.checks.outputs.publish_required == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'failure')
    concurrency:
      group: ghcr-publication-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Require enabled trusted main recorder
        run: |
          if [[ ! -f scripts/record_release.py ]]; then
            echo 'bootstrap_not_enabled: trusted main recorder requires reviewed enablement' >&2
            exit 1
          fi
      - name: Independently verify and record fixed image pair
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.run_id }}
          ORIGINAL_ATTEMPT: ${{ github.run_attempt }}
          ORIGINAL_SOURCE: ${{ needs.checks.outputs.source_sha }}
          ORIGINAL_VERSION: ${{ needs.checks.outputs.version }}
        run: python3 scripts/record_release.py --apply --output "$RUNNER_TEMP/release-record.json"

  # Own main failures here: bot-dispatched runs may have no workflow_run observer.
  main-failure-notification:
    needs: [checks, build, verify, publish, release-record]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Always succeed for beta/no-op runs so the beta controller can verify all jobs.
      - name: Decide whether main publication failed
        id: decision
        run: echo "notify=${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && needs.checks.outputs.image_required != 'false' && (needs.verify.result != 'success' || needs.publish.result != 'success' || needs.release-record.result != 'success') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.decision.outputs.notify == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report current main publication failure
        if: steps.decision.outputs.notify == 'true'
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/release_control.py --main-failure --output "$RUNNER_TEMP/main-failure.json"
      - name: Validate Bark failure notification without delivery
        if: steps.report.outputs.notify == 'true'
        env:
          BARK_URL: https://notification.invalid/dry-run
        run: python3 scripts/notify_bark.py --report "$RUNNER_TEMP/main-failure.json" --dry-run
      - name: Notify main publication failure through Bark
        if: steps.report.outputs.notify == 'true'
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python3 scripts/notify_bark.py --report "$RUNNER_TEMP/main-failure.json"
