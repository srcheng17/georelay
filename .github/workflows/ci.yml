name: Validate and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish checked versioned images (main or upstream/<stable-tag>; no deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            runner: ubuntu-latest
          - architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Python checks
        run: |
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Check fixed upstream and apply every patch
        run: python3 scripts/prepare_upstream.py "$RUNNER_TEMP/teslamate-upstream"
      - name: Upstream contract tests in isolated containers
        run: bash scripts/test_upstream.sh "$RUNNER_TEMP/teslamate-upstream"
      - name: Version from reviewed pin and tested commit
        id: version
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("upstream.json"))["tag"])')
          echo "value=${tag}-amap-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build adapter and patched TeslaMate
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          labels=(--label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$IMAGE_VERSION")
          docker build --platform "linux/$IMAGE_ARCHITECTURE" "${labels[@]}" --label 'org.opencontainers.image.title=TeslaMate AMap adapter (independent companion)' -t amap-adapter:checked adapter
          docker build --platform "linux/$IMAGE_ARCHITECTURE" "${labels[@]}" --label 'org.opencontainers.image.title=TeslaMate (modified: configurable geocoder URL)' -t teslamate-amap:checked "$RUNNER_TEMP/teslamate-upstream"
          for image in amap-adapter teslamate-amap; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image:checked")" = "linux/$IMAGE_ARCHITECTURE"
            uid=$(docker run --rm --entrypoint id "$image:checked" -u)
            [[ $uid =~ ^[1-9][0-9]*$ ]] || exit 1
          done
          docker run --rm --entrypoint /bin/sh teslamate-amap:checked -c 'test -s /usr/share/doc/teslamate/LICENSE && test -s /usr/share/doc/teslamate/NOTICE'
          docker run --rm --entrypoint /bin/sh amap-adapter:checked -c 'test -s /usr/share/doc/amap-adapter/LICENSE'
      - name: Adapter container health without a key or host port
        run: |
          container="amap-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${container}-data"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume"
          docker run -d --name "$container" --network none --mount "type=volume,source=$volume,target=/data" amap-adapter:checked
          healthy=false
          for attempt in $(seq 1 20); do
            if docker exec "$container" python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)) == {"status": "ok"}' >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
      - name: Preserve checked images for publication
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: docker save -o "$RUNNER_TEMP/checked-images-$IMAGE_ARCHITECTURE.tar" amap-adapter:checked teslamate-amap:checked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        with:
          name: checked-images-${{ matrix.architecture }}
          path: ${{ runner.temp }}/checked-images-${{ matrix.architecture }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Keep the single required check name for main's branch protection.
  verify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every architecture to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  publish:
    needs: [build, verify]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: checked-images-*
          merge-multiple: true
          path: ${{ runner.temp }}/checked-images
      - name: Publish only the checked multi-architecture version
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: bash scripts/publish_images.sh "$RUNNER_TEMP/checked-images"
